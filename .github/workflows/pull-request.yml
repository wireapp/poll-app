name: Build

on:
  workflow_dispatch:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Lint
        run: |
          ./gradlew ktlintCheck
      - name: Detekt
        run: |
          ./gradlew detekt
      - name: Build
        run: |
          ./gradlew build --info
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
